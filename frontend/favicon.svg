<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ff" />
      <stop offset="100%" stop-color="#b026ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="spokeGlow" gradientUnits="userSpaceOnUse" x1="32" y1="44" x2="68" y2="80">
      <stop offset="0%" stop-color="#0ff" />
      <stop offset="100%" stop-color="#b026ff" />
    </linearGradient>
  </defs>

  <!-- Dark Terminal Background -->
  <rect width="100" height="100" rx="10" fill="#11111b" />

  <g filter="url(#glow)">
    <!-- Folder Base -->
    <path d="M 15 25 
             L 35 25 
             L 45 35 
             L 85 35 
             Q 90 35 90 40 
             L 90 85 
             Q 90 90 85 90 
             L 15 90 
             Q 10 90 10 85 
             L 10 30 
             Q 10 25 15 25 Z" fill="none" stroke="url(#neonGlow)" stroke-width="2.5" stroke-linejoin="round" />
          
    <!-- Inner folder rim detail -->
    <line x1="12" y1="37" x2="88" y2="37" stroke="#b026ff" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Left Circuit Runes -->
    <polyline points="20,45 25,45 25,55 30,55" fill="none" stroke="#0ff" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="30" cy="55" r="1.5" fill="#0ff" />
    <path d="M 22 65 L 22 75 L 27 70 Z" fill="none" stroke="#39ff14" stroke-width="1" />

    <!-- Right Circuit Runes -->
    <polyline points="80,75 75,75 75,65 70,65" fill="none" stroke="#b026ff" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="70" cy="65" r="1.5" fill="#b026ff" />
    <circle cx="78" cy="50" r="2" fill="none" stroke="#39ff14" stroke-width="1" />
    <line x1="78" y1="48" x2="78" y2="52" stroke="#39ff14" stroke-width="1" />
    <line x1="76" y1="50" x2="80" y2="50" stroke="#39ff14" stroke-width="1" />

    <!-- Kubernetes Helm / Occult Wheel -->
    <circle cx="50" cy="62" r="14" fill="none" stroke="url(#neonGlow)" stroke-width="2" />
    <circle cx="50" cy="62" r="18" fill="none" stroke="#0ff" stroke-width="1" stroke-dasharray="4 3" />
    
    <!-- 7 Spokes of Kubernetes -->
    <g stroke="url(#spokeGlow)" stroke-width="2.5" stroke-linecap="round">
      <line x1="50" y1="48" x2="50" y2="42" transform="rotate(0 50 62)" />
      <line x1="50" y1="48" x2="50" y2="42" transform="rotate(51.4 50 62)" />
      <line x1="50" y1="48" x2="50" y2="42" transform="rotate(102.8 50 62)" />
      <line x1="50" y1="48" x2="50" y2="42" transform="rotate(154.2 50 62)" />
      <line x1="50" y1="48" x2="50" y2="42" transform="rotate(205.7 50 62)" />
      <line x1="50" y1="48" x2="50" y2="42" transform="rotate(257.1 50 62)" />
      <line x1="50" y1="48" x2="50" y2="42" transform="rotate(308.5 50 62)" />
    </g>

    <!-- Occult Center Eye -->
    <path d="M 41 62 Q 50 53 59 62 Q 50 71 41 62 Z" fill="none" stroke="#b026ff" stroke-width="1.5" />
    <circle cx="50" cy="62" r="3" fill="#39ff14" />
    
    <!-- Floating mystical nodes -->
    <circle cx="28" cy="30" r="1" fill="#0ff" />
    <circle cx="34" cy="28" r="1" fill="#b026ff" />
    <circle cx="70" cy="30" r="1" fill="#39ff14" />
  </g>
</svg>