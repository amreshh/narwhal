apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: narwhal

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Point this at the image you pushed:
#   kubectl kustomize deploy | kubectl apply -f -   (or: kubectl apply -k deploy)
images:
  - name: narwhal
    newName: ghcr.io/amreshh/narwhal
    newTag: latest
