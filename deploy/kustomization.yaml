apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: narwhal

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Where the image comes from; its version is set in deployment.yaml. To run an
# image you pushed yourself, point newName at it (and add newTag if its version
# differs).
#   kubectl kustomize deploy | kubectl apply -f -   (or: kubectl apply -k deploy)
images:
  - name: narwhal
    newName: ghcr.io/amreshh/narwhal
