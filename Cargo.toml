[workspace]
resolver = "2"
members = ["shared", "server", "frontend", "office"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Shared by every crate (each has `[lints] workspace = true`).
[workspace.lints.rust]
# There is no unsafe code, and for a server whose job is to keep access
# inside one folder, that's worth guaranteeing.
unsafe_code = "forbid"
