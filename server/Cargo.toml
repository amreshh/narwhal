[package]
name = "narwhal-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "narwhal"
path = "src/main.rs"

[dependencies]
narwhal-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "signal", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2"
mime_guess = "2"
# openat-style file access confined to the root (see src/confined.rs).
rustix = { version = "1", features = ["fs", "process"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"
