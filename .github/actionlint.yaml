# actionlint settings: https://github.com/rhysd/actionlint/blob/main/docs/config.md
paths:
  .github/workflows/*.yaml:
    ignore:
      # GitHub's self-repository syntax for workflows and actions in this repo
      # (uses: $/...), which zizmor asks for, is newer than actionlint 1.7.12.
      # Remove once actionlint understands it.
      - 'reusable workflow call "\$/\.github/workflows/[a-z]+\.yaml" at "uses" is not following the format'
      - 'specifying action "\$/\.github/actions/[a-z-]+" in invalid format'
