name: image scan

# Scans the latest released image every day, so vulnerabilities published
# since the release show up in Security → Code scanning (and in the run
# summary) without waiting for the next one. Fails, and GitHub emails you,
# when there's a HIGH or CRITICAL one with a fix: merge Dependabot's base
# image update (or another fix) to release a rebuilt image, or accept it in
# .trivyignore with a reason.
on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the latest release, .trivyignore
      packages: read # pull the image
      security-events: write # the report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the name the ci workflow scans under, so code scanning
      # sees the same findings as the release build's, not new ones.
      - name: Pull the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${tag#v}"
          echo "Scanning $image ($tag)"
          docker pull "$image"
          docker tag "$image" narwhal:scan

      - name: Scan image
        uses: $/.github/actions/scan-image
        with:
          image: narwhal:scan
