name: ci

# Every push and pull request runs this one pipeline. The checks run side by
# side; the image is only built when all of them pass:
#
#   plan ─┬─ test ─────┐
#         ├─ lint ─────┤
#         ├─ security ─┼─ build ─┬─ release (main)
#         ├─ fuzz ─────┘         │
#         └─ promote (main) ─────┘
#
# lint, security and fuzz are in their own files and called from here;
# security and fuzz also run weekly on their own. Reports from the image scan,
# zizmor and hadolint go to Security → Code scanning, and the image scan's
# table to the run summary. `checks` sums up the checks for branch rules.
#
# dev            -> ghcr.io/<repo>:<short-sha>, :latest
#                   (skipped when the files didn't change, e.g. dev reset to main
#                   after a merge)
# push to main   -> next version (see below), then git tag v1.2.3 + GitHub Release
#                   with generated notes. The image is not rebuilt: the dev image
#                   of the merged PR (same files, already checked) is retagged as
#                   :1.2.3, :1.2, :1. Only when no such image exists (e.g. a PR
#                   straight into main) do the checks and the build run here.
# tag v1.2.3     -> ghcr.io/<repo>:1.2.3, :1.2, :1  (manual; tag must be on main)
#                   (no major-only tag while on 0.x: 0.x minors can break)
# tag v1.2.3-rc1 -> ghcr.io/<repo>:1.2.3-rc1 only
# pull requests  -> checks + build only, nothing pushed
#
# Version on main: bumps the patch of the latest vX.Y.Z tag. Put "#minor" or
# "#major" in a commit message (e.g. the merge commit) to bump that instead.
# With no tags yet, the first release uses the version in Cargo.toml.
on:
  push:
    branches: [dev, main]
    # Version-shaped tags only, so a stray tag like "vtest" never triggers a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway (image pushed but no tag/release yet).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No token permissions unless a job asks for them.
permissions: {}

jobs:
  # Decides what this run has to do. Only runs for main and dev pushes.
  plan:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      image: ${{ steps.exists.outputs.image }}
      skip: ${{ steps.dev.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out next version
        id: next
        if: github.ref == 'refs/heads/main'
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if git tag --points-at HEAD | grep -qE "$stable"; then
            echo "HEAD is already released, nothing to do"
            exit 0
          fi

          last=$(git tag -l 'v*' --sort=-v:refname | grep -E "$stable" | head -1 || true)
          if [ -z "$last" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log "$last..HEAD" --format=%B)
            if grep -q '#major' <<< "$log"; then
              version="$((major + 1)).0.0"
            elif grep -q '#minor' <<< "$log"; then
              version="$major.$((minor + 1)).0"
            else
              version="$major.$minor.$((patch + 1))"
            fi
          fi

          echo "Releasing v$version (previous: ${last:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # After a merge, dev is reset to main: same files as before, nothing new to check or build.
      - name: Check dev content changed
        id: dev
        if: github.ref == 'refs/heads/dev'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha 2>/dev/null || true; }
          now=$(tree "$GITHUB_SHA")
          if [ -n "$now" ] && [ "$(tree "$BEFORE")" = "$now" ]; then
            echo "Files are identical to the previous dev commit ${BEFORE:0:7}, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The merged PR's head was pushed to dev, which checked it and pushed ghcr.io/<repo>:<short-sha>.
      # If main now has exactly those files, that image is what we release.
      - name: Find the merged PR's dev image
        id: pr
        if: steps.next.outputs.version != ''
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha 2>/dev/null || true; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0].head.sha // empty" || true)
          if [ -z "$head" ]; then
            echo "No merged PR found for $GITHUB_SHA, will build"
          elif [ "$(tree "$head")" != "$(tree "$GITHUB_SHA")" ]; then
            echo "main differs from PR head ${head:0:7}, will build"
          else
            echo "candidate=ghcr.io/${GITHUB_REPOSITORY,,}:${head:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.pr.outputs.candidate != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the dev image exists
        id: exists
        if: steps.pr.outputs.candidate != ''
        env:
          CANDIDATE: ${{ steps.pr.outputs.candidate }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE" > /dev/null 2>&1; then
            echo "Releasing existing image $CANDIDATE"
            echo "image=$CANDIDATE" >> "$GITHUB_OUTPUT"
          else
            echo "$CANDIDATE not found, will build"
          fi

  # The checks (test, lint, security, fuzz) all run under the same condition:
  # skipped when dev didn't change, and on main when the dev image is reused
  # (those files were already checked on dev).
  test:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.skip != 'true' &&
      (github.ref != 'refs/heads/main' || (needs.plan.outputs.version != '' && needs.plan.outputs.image == ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      # Caches ~/.cargo and target/ between runs, keyed on Cargo.lock and the toolchain.
      # zizmor's cache-poisoning warning doesn't apply: this cache only speeds up
      # compiling the tests and never reaches the image, and caches from PRs
      # can't be read by main or tag runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # zizmor: ignore[cache-poisoning] v2.9.3

      # The frontend's tests cover plain logic, so they run here too (not in a browser).
      - name: Tests
        run: cargo test --locked -p narwhal-server -p narwhal-shared -p narwhal-office -p narwhal-frontend

  # Formatting and lints (lint.yaml).
  lint:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.skip != 'true' &&
      (github.ref != 'refs/heads/main' || (needs.plan.outputs.version != '' && needs.plan.outputs.image == ''))
    uses: $/.github/workflows/lint.yaml
    permissions:
      contents: read
      security-events: write # hadolint's report

  # zizmor on the workflows (security.yaml).
  security:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.skip != 'true' &&
      (github.ref != 'refs/heads/main' || (needs.plan.outputs.version != '' && needs.plan.outputs.image == ''))
    uses: $/.github/workflows/security.yaml
    permissions:
      contents: read
      security-events: write # zizmor's report

  # A short fuzzing run of the document readers (fuzz.yaml); the weekly one is longer.
  fuzz:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.skip != 'true' &&
      (github.ref != 'refs/heads/main' || (needs.plan.outputs.version != '' && needs.plan.outputs.image == ''))
    uses: $/.github/workflows/fuzz.yaml
    with:
      seconds: "60"
    permissions:
      contents: read

  # The one check to require in branch rules: fails when any check failed or
  # was cancelled. (A skipped job counts as passed, so requiring build alone
  # would let a failed lint through: build is then skipped.)
  checks:
    needs: [plan, test, lint, security, fuzz]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan, test, lint, security, fuzz: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  # Runs when all the checks ran and passed (see test for when they run).
  build:
    needs: [plan, test, lint, security, fuzz]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.security.result == 'success' && needs.fuzz.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write # the image scan's report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # On main, semver tags come from the computed version; on tag pushes, from the tag.
          tags: |
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.version }},enable=${{ !startsWith(needs.plan.outputs.version, '0.') && !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr

      # Built into the runner's Docker first, so it can be scanned before
      # anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: narwhal:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One scan, used three times: the run summary, code scanning, and the
      # check that decides whether the image is pushed.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: narwhal:scan
          version: v0.76.2
          format: json
          output: trivy.json

      - name: Image scan report
        run: |
          jq -r -f .github/trivy-summary.jq trivy.json >> "$GITHUB_STEP_SUMMARY"
          trivy convert --format sarif --output trivy.sarif trivy.json

      - name: Upload image scan to code scanning
        # Pull requests from forks get a read-only token.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # Fails on HIGH or CRITICAL vulnerabilities that have a fix (in the base
      # image's Debian packages). To accept one, add its ID to .trivyignore
      # with a comment saying why.
      - name: Check image scan
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' trivy.json)
          if [ "$n" -gt 0 ]; then
            echo "::error::$n HIGH or CRITICAL vulnerabilities with a fix in the image, see the run summary"
            exit 1
          fi

      # Same build, all layers from the cache.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # main: give the already-built dev image its release tags.
  promote:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.image != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # Same semver tags as the build job.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.version }},enable=${{ !startsWith(needs.plan.outputs.version, '0.') }}

      # Copies the manifest under the new tags; no layers are rebuilt or re-uploaded.
      - name: Retag dev image
        env:
          SOURCE: ${{ needs.plan.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

  release:
    needs: [plan, build, promote]
    # Exactly one of build/promote runs on main.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.version != '' &&
      (needs.build.result == 'success' || needs.promote.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Tags created with GITHUB_TOKEN don't trigger workflows, so this won't rebuild.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.plan.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
