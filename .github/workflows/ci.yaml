name: ci

# What runs when:
#
#   push to dev    tests, then build ghcr.io/<repo>:<short-sha> and :latest
#                  (skipped when the files didn't change, e.g. dev reset to
#                  main after a merge)
#   pull request   tests, lint, security and fuzzing side by side, then build
#                  and scan the image (nothing pushed). A comment on the PR
#                  sums up the results.
#   push to main   the same checks, then the release build: the next version
#                  (see below) as :1.2.3, :1.2, :1, a git tag v1.2.3 and a
#                  GitHub Release with generated notes
#   tag v1.2.3     the same checks, then :1.2.3, :1.2, :1 (manual; the tag
#                  must be on main). No major-only tag while on 0.x: 0.x
#                  minors can break. A tag like v1.2.3-rc1 gets only that tag.
#
#   plan ─┬─ test ─────┐
#         ├─ lint ─────┤               ┌─ release (main)
#         ├─ security ─┼─── build ─────┤
#         └─ fuzz ─────┘               └─ report (pull requests)
#
# lint, security and fuzz are in their own files and called from here;
# security and fuzz also run weekly on their own. The image is scanned with
# Trivy (.github/actions/scan-image): a table in the run summary, and builds
# fail on HIGH or CRITICAL vulnerabilities that have a fix. Reports from
# Trivy, zizmor and hadolint go to Security → Code scanning; image-scan.yaml
# rescans the latest release daily. `checks` sums up the checks for branch rules.
#
# Version on main: bumps the patch of the latest vX.Y.Z tag. Put "#minor" or
# "#major" in a commit message (e.g. the merge commit) to bump that instead.
# With no tags yet, the first release uses the version in Cargo.toml.
on:
  push:
    branches: [dev, main]
    # Version-shaped tags only, so a stray tag like "vtest" never triggers a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway (image pushed but no tag/release yet).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No token permissions unless a job asks for them.
permissions: {}

jobs:
  # Decides what this run has to do. Only runs for main and dev pushes.
  plan:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.dev.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out next version
        id: next
        if: github.ref == 'refs/heads/main'
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if git tag --points-at HEAD | grep -qE "$stable"; then
            echo "HEAD is already released, nothing to do"
            exit 0
          fi

          last=$(git tag -l 'v*' --sort=-v:refname | grep -E "$stable" | head -1 || true)
          if [ -z "$last" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log "$last..HEAD" --format=%B)
            if grep -q '#major' <<< "$log"; then
              version="$((major + 1)).0.0"
            elif grep -q '#minor' <<< "$log"; then
              version="$major.$((minor + 1)).0"
            else
              version="$major.$minor.$((patch + 1))"
            fi
          fi

          echo "Releasing v$version (previous: ${last:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # After a merge, dev is reset to main: same files as before, nothing new to test or build.
      - name: Check dev content changed
        id: dev
        if: github.ref == 'refs/heads/dev'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha 2>/dev/null || true; }
          now=$(tree "$GITHUB_SHA")
          if [ -n "$now" ] && [ "$(tree "$BEFORE")" = "$now" ]; then
            echo "Files are identical to the previous dev commit ${BEFORE:0:7}, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  # Every run except an unchanged dev push, or main when HEAD is already released.
  test:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.skip != 'true' &&
      (github.ref != 'refs/heads/main' || needs.plan.outputs.version != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      # Caches ~/.cargo and target/ between runs, keyed on Cargo.lock and the toolchain.
      # zizmor's cache-poisoning warning doesn't apply: this cache only speeds up
      # compiling the tests and never reaches the image, and caches from PRs
      # can't be read by main or tag runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # zizmor: ignore[cache-poisoning] v2.9.3

      # The frontend's tests cover plain logic, so they run here too (not in a browser).
      - name: Tests
        run: cargo test --locked -p narwhal-server -p narwhal-shared -p narwhal-office -p narwhal-frontend

  # lint, security and fuzz: pull requests, main and tags, not dev pushes
  # (dev gets the quick tests + build; the pull request runs everything).

  # Formatting and lints (lint.yaml).
  lint:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/dev') &&
      (github.ref != 'refs/heads/main' || needs.plan.outputs.version != '')
    uses: $/.github/workflows/lint.yaml
    permissions:
      contents: read
      security-events: write # hadolint's report

  # zizmor on the workflows (security.yaml).
  security:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/dev') &&
      (github.ref != 'refs/heads/main' || needs.plan.outputs.version != '')
    uses: $/.github/workflows/security.yaml
    permissions:
      contents: read
      security-events: write # zizmor's report

  # A short fuzzing run of the document readers (fuzz.yaml); the weekly one is longer.
  fuzz:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/dev') &&
      (github.ref != 'refs/heads/main' || needs.plan.outputs.version != '')
    uses: $/.github/workflows/fuzz.yaml
    with:
      seconds: "60"
    permissions:
      contents: read

  # The one check to require in branch rules: fails when any check failed or
  # was cancelled. (A skipped job counts as passed, so requiring build alone
  # would let a failed lint through: build is then skipped.)
  checks:
    needs: [plan, test, lint, security, fuzz]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan, test, lint, security, fuzz: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  # Runs when the tests passed and no other check failed (lint, security and
  # fuzz are skipped on dev pushes).
  build:
    needs: [plan, test, lint, security, fuzz]
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write # the image scan's report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # On main, semver tags come from the computed version; on tag pushes, from the tag.
          tags: |
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.version }},enable=${{ !startsWith(needs.plan.outputs.version, '0.') && !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr

      # Built into the runner's Docker first, so it can be scanned before
      # anything is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: narwhal:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Table in the run summary, report to code scanning, and a failure on
      # HIGH or CRITICAL vulnerabilities that have a fix (.github/actions/scan-image).
      # Every run scans the same name, so GitHub can match a pull request's
      # findings with main's.
      - name: Scan image
        uses: $/.github/actions/scan-image
        with:
          image: narwhal:scan

      # The scan table, for the pull request comment.
      - name: Keep the scan table
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: trivy-summary.md
          if-no-files-found: ignore
          retention-days: 7

      # Same build, all layers from the cache.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    needs: [plan, build]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.version != '' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Tags created with GITHUB_TOKEN don't trigger workflows, so this won't rebuild.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.plan.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes

  # Pull requests: one comment with the results and the image scan, updated
  # on every run. (Pull requests from forks get a read-only token: no comment.)
  report:
    needs: [test, lint, security, fuzz, build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # the comment
    steps:
      # Missing when the image wasn't built (a check failed first).
      - name: Get the scan table
        if: needs.build.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-scan

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
          FUZZ: ${{ needs.fuzz.result }}
          BUILD: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ passed" ;;
              failure) echo "❌ failed" ;;
              cancelled) echo "⚪ cancelled" ;;
              skipped) echo "⏭️ skipped" ;;
              *) echo "$1" ;;
            esac
          }
          marker="<!-- narwhal-ci-report -->"
          {
            echo "$marker"
            echo "## CI for ${SHA:0:7}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Tests | $(icon "$TEST") |"
            echo "| Lint: rustfmt, leptosfmt, clippy, typos, actionlint, hadolint, kubeconform | $(icon "$LINT") |"
            echo "| Security: zizmor | $(icon "$SECURITY") |"
            echo "| Fuzzing | $(icon "$FUZZ") |"
            echo "| Image build and scan | $(icon "$BUILD") |"
            echo
            if [ -f trivy-summary.md ]; then
              cat trivy-summary.md
              echo
            fi
            echo "[Run details]($RUN_URL) · [Code scanning alerts for this PR]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security/code-scanning?query=pr%3A$PR+is%3Aopen)"
          } > comment.md

          # Update the earlier comment if there is one, so the PR keeps one.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            jq -n --rawfile body comment.md '{body: $body}' |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
          else
            jq -n --rawfile body comment.md '{body: $body}' |
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input - > /dev/null
          fi
