name: security

# zizmor: security problems in the GitHub Actions workflows. Called by the ci
# workflow; also runs weekly, so newly reported problems with the actions in
# use show up even when nothing changes here.
#
# CodeQL runs through GitHub's default setup (repository settings → Advanced
# Security), not here: a CodeQL workflow can't upload while that's on. The
# container image is scanned in the ci workflow, before it's pushed.
on:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SARIF to Security → Code scanning. zizmor never fails in this mode,
      # so the next step does the checking.
      - name: zizmor report
        id: report
        if: ${{ !github.event.pull_request.head.repo.fork }} # forks get a read-only token
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0

      # The action uploads to GitHub's test merge commit, which GitHub can
      # rebuild at any time; code scanning then blocks the merge until it has
      # results for the new one. The pull request's head commit stays put.
      - name: zizmor report on the head commit
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.report.outputs.output-file }}
          category: zizmor
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      # Fails on findings and marks them on the workflow lines.
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
