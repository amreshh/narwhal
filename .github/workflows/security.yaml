name: security

# zizmor: security problems in the GitHub Actions workflows. Called by the ci
# workflow on pull requests, where any finding fails the checks; also runs
# weekly, so newly reported problems with the actions in use show up even
# when nothing changes here.
#
# Its report also goes to Security → Code scanning: zizmor-action writes the
# SARIF that the table below is made from only when it uploads it too. The
# branch rules don't require it (the failing step below already blocks the
# merge), and the weekly run keeps main's results there current.
#
# CodeQL has a workflow of its own, codeql.yaml.
# Dependencies are checked by the ci workflow's dependency review (pull
# requests) and by Dependabot alerts (what's released).
on:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the report
    steps:
      # Pull requests: the head commit, not GitHub's test merge commit, so the
      # report is uploaded for the head commit (upload-sarif uses the commit
      # that's checked out). (Empty on other events: the default.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # SARIF, for the table, also uploaded to code scanning. zizmor never
      # fails in this mode, so the last step does the checking.
      - name: zizmor report
        id: report
        if: ${{ !github.event.pull_request.head.repo.fork }} # forks get a read-only token
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0

      # The findings as a table: in the run summary and the pull request comment.
      - name: zizmor table
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: $/.github/actions/sarif-summary
        with:
          sarif: ${{ steps.report.outputs.output-file }}
          name: zizmor
          title: Workflow security (zizmor)

      # Fails on findings and marks them on the workflow lines.
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
