name: security

# zizmor: security problems in the GitHub Actions workflows (fails the run).
# Also runs weekly, so newly reported problems with the actions in use show up.
#
# CodeQL runs through GitHub's default setup (repository settings → Advanced
# Security), not here: a CodeQL workflow can't upload while that's on. The
# container image is scanned in the container workflow, before it's pushed.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Report in the log and fail, instead of uploading to the Security tab.
          advanced-security: false
