name: lint

# Formatting and lints, called by the ci workflow (alongside the tests,
# before the image is built). Can also be run by hand from the Actions tab.
#
#   fmt          rustfmt (rustfmt.toml) and leptosfmt for view! markup
#                (leptosfmt.toml). Fix with: cargo fmt --all && leptosfmt frontend/src
#   clippy       warnings are errors
#   typos        spell check (exceptions in typos.toml)
#   actionlint   the workflow files, including their shell scripts
#   hadolint     the Dockerfile; its report also goes to Security → Code scanning
#   kubeconform  the Kubernetes manifests in deploy/
#
# Actions are pinned to commits; Dependabot keeps them current.
on:
  workflow_call:
    inputs:
      docs-only:
        description: Only the docs changed, so only the spell check runs
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      # Keeps the leptosfmt build below between runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install leptosfmt
        run: cargo install leptosfmt --locked --version 0.1.33

      - name: rustfmt
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check

      # The markup inside view! macros, which rustfmt leaves alone.
      - name: leptosfmt
        run: leptosfmt --check frontend/src

  clippy:
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add wasm32-unknown-unknown

      # Caches ~/.cargo and target/ between runs, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The frontend only builds for the browser, so it's checked for wasm on its own.
      - name: Clippy
        run: |
          cargo clippy --locked -p narwhal-server -p narwhal-shared -p narwhal-office --all-targets -- -D warnings
          cargo clippy --locked -p narwhal-frontend --target wasm32-unknown-unknown -- -D warnings

  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  actionlint:
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-24.04
    env:
      VERSION: 1.7.12
      SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also runs ShellCheck (installed on the runner) on the run: scripts.
      - name: actionlint
        run: |
          file="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" actionlint
          ./actionlint -color

  hadolint:
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint report
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload report to code scanning
        # Pull requests from forks get a read-only token.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      # Same check, readable in the log, and fails the job.
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  kubeconform:
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.8.0
      SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validates what `kubectl apply -k deploy` would send.
      - name: kubeconform
        run: |
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          kubectl kustomize deploy | ./kubeconform -strict -summary -
