name: container

# dev            -> ghcr.io/<repo>:<short-sha>, :latest
#                   (skipped when the files didn't change, e.g. dev reset to main
#                   after a merge)
# push to main   -> next version (see below), then git tag v1.2.3 + GitHub Release
#                   with generated notes. The image is not rebuilt: the dev image
#                   of the merged PR (same files, already tested) is retagged as
#                   :1.2.3, :1.2, :1. Only when no such image exists (e.g. a PR
#                   straight into main) are tests and the build run here.
# tag v1.2.3     -> ghcr.io/<repo>:1.2.3, :1.2, :1  (manual; tag must be on main)
#                   (no major-only tag while on 0.x: 0.x minors can break)
# tag v1.2.3-rc1 -> ghcr.io/<repo>:1.2.3-rc1 only
# pull requests  -> tests + build only, nothing pushed
#
# Version on main: bumps the patch of the latest vX.Y.Z tag. Put "#minor" or
# "#major" in a commit message (e.g. the merge commit) to bump that instead.
# With no tags yet, the first release uses the version in Cargo.toml.
on:
  push:
    branches: [dev, main]
    # Version-shaped tags only, so a stray tag like "vtest" never triggers a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway (image pushed but no tag/release yet).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides what this run has to do. Only runs for main and dev pushes.
  plan:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      image: ${{ steps.exists.outputs.image }}
      skip: ${{ steps.dev.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0

      - name: Work out next version
        id: next
        if: github.ref == 'refs/heads/main'
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if git tag --points-at HEAD | grep -qE "$stable"; then
            echo "HEAD is already released, nothing to do"
            exit 0
          fi

          last=$(git tag -l 'v*' --sort=-v:refname | grep -E "$stable" | head -1 || true)
          if [ -z "$last" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log "$last..HEAD" --format=%B)
            if grep -q '#major' <<< "$log"; then
              version="$((major + 1)).0.0"
            elif grep -q '#minor' <<< "$log"; then
              version="$major.$((minor + 1)).0"
            else
              version="$major.$minor.$((patch + 1))"
            fi
          fi

          echo "Releasing v$version (previous: ${last:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # After a merge, dev is reset to main: same files as before, nothing new to test or build.
      - name: Check dev content changed
        id: dev
        if: github.ref == 'refs/heads/dev'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha 2>/dev/null || true; }
          now=$(tree "$GITHUB_SHA")
          if [ -n "$now" ] && [ "$(tree "$BEFORE")" = "$now" ]; then
            echo "Files are identical to the previous dev commit ${BEFORE:0:7}, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The merged PR's head was pushed to dev, which tested it and pushed ghcr.io/<repo>:<short-sha>.
      # If main now has exactly those files, that image is what we release.
      - name: Find the merged PR's dev image
        id: pr
        if: steps.next.outputs.version != ''
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha 2>/dev/null || true; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0].head.sha // empty" || true)
          if [ -z "$head" ]; then
            echo "No merged PR found for $GITHUB_SHA, will build"
          elif [ "$(tree "$head")" != "$(tree "$GITHUB_SHA")" ]; then
            echo "main differs from PR head ${head:0:7}, will build"
          else
            echo "candidate=ghcr.io/${GITHUB_REPOSITORY,,}:${head:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.pr.outputs.candidate != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the dev image exists
        id: exists
        if: steps.pr.outputs.candidate != ''
        env:
          CANDIDATE: ${{ steps.pr.outputs.candidate }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE" > /dev/null 2>&1; then
            echo "Releasing existing image $CANDIDATE"
            echo "image=$CANDIDATE" >> "$GITHUB_OUTPUT"
          else
            echo "$CANDIDATE not found, will build"
          fi

  # Tests and lints: nothing is built or published unless they pass.
  # Skipped on main when the dev image is reused (that code was already tested).
  test:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result != 'failure' && needs.plan.outputs.skip != 'true' &&
      (github.ref != 'refs/heads/main' || (needs.plan.outputs.version != '' && needs.plan.outputs.image == ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add wasm32-unknown-unknown

      # Caches ~/.cargo and target/ between runs, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked -p narwhal-server -p narwhal-shared -p narwhal-office

      - name: Lints
        run: |
          cargo clippy --locked -p narwhal-server -p narwhal-shared -p narwhal-office --all-targets -- -D warnings
          cargo clippy --locked -p narwhal-frontend --target wasm32-unknown-unknown -- -D warnings

  # Runs whenever tests ran and passed (see the test job for when that is).
  build:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # On main, semver tags come from the computed version; on tag pushes, from the tag.
          tags: |
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.version }},enable=${{ !startsWith(needs.plan.outputs.version, '0.') && !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main: give the already-built dev image its release tags.
  promote:
    needs: plan
    if: needs.plan.outputs.version != '' && needs.plan.outputs.image != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # Same semver tags as the build job.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.version }},enable=${{ !startsWith(needs.plan.outputs.version, '0.') }}

      # Copies the manifest under the new tags; no layers are rebuilt or re-uploaded.
      - name: Retag dev image
        env:
          SOURCE: ${{ needs.plan.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

  release:
    needs: [plan, build, promote]
    # Exactly one of build/promote runs on main.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.plan.outputs.version != '' &&
      (needs.build.result == 'success' || needs.promote.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Tags created with GITHUB_TOKEN don't trigger workflows, so this won't rebuild.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.plan.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
