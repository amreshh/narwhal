name: fuzz

# Feeds the office document readers (office/) random and malformed files and
# fails on a panic, a hang (10 s) or runaway memory use. The ci workflow runs
# it for a minute per target when a pull request changes the readers, their
# dependencies or the fuzzing (tags and manual runs always fuzz); on its own
# it runs weekly for 10 minutes per target, building on the inputs found so
# far.
#
# A crashing input is uploaded as an artifact. Reproduce it with
#   cp Cargo.lock fuzz/ && cargo +nightly fuzz run <target> <file>
# (the nightly in NIGHTLY below, if a newer one doesn't crash).
on:
  workflow_call:
    inputs:
      seconds:
        description: Seconds per target
        type: string
        default: "60"
  schedule:
    - cron: "43 3 * * 1" # Mondays, 03:43 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # parse: raw bytes. zip_parts / cfb_streams: valid containers with
        # fuzzed parts, so the XML and binary-format readers get the attention.
        target: [parse, zip_parts, cfb_streams]
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'schedule' && '600') || '60' }}
      # A fixed nightly, not the latest: rust-cache's key includes the
      # compiler version, so with each day's new nightly the first run missed
      # the cache and compiled cargo-fuzz and the targets again. Move it
      # forward every few months, or when the fuzzing needs a newer one.
      NIGHTLY: nightly-2026-11-11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      # fuzz/ has no lockfile of its own: start from the app's so the readers
      # are fuzzed with the dependency versions that ship.
      - name: Lockfile
        run: cp Cargo.lock fuzz/Cargo.lock

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      # Inputs that reached new code are kept between runs, so each run
      # continues where the last one stopped.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        run: >-
          cargo "+$NIGHTLY" fuzz run "$TARGET" --
          -max_total_time="$SECONDS_PER_TARGET" -max_len=65536 -timeout=10 -rss_limit_mb=2048

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
