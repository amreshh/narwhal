# Areas of the code, by the files a change touches:
# - Pull requests get a label for each area they touch (workflows/labeler.yaml).
#   A label that doesn't exist yet is created the first time it's used; set
#   its colour and description under Issues → Labels.
# - Release notes list each commit under the first area it touches, in this
#   order (scripts/release-notes.sh), so put the more specific areas first.

# Bypassed vulnerabilities: a maintainer's decision worth a second look.
security:
  - changed-files:
      - any-glob-to-any-file: .trivyignore.yaml

image:
  - changed-files:
      - any-glob-to-any-file: [Dockerfile, .dockerignore, .github/release/**]

server:
  - changed-files:
      - any-glob-to-any-file: server/**

frontend:
  - changed-files:
      - any-glob-to-any-file: frontend/**

office:
  - changed-files:
      - any-glob-to-any-file: office/**

shared:
  - changed-files:
      - any-glob-to-any-file: shared/**

deploy:
  - changed-files:
      - any-glob-to-any-file: deploy/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**
          - .github/scripts/**
          - .github/*.yaml

fuzz:
  - changed-files:
      - any-glob-to-any-file: fuzz/**

dependencies:
  - changed-files:
      - any-glob-to-any-file: Cargo.lock

# The same files ci.yaml treats as docs (no tests, build or release).
docs:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", docs/**]
