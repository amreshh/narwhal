# Dependabot version updates. Only read from the default branch (main);
# PRs are opened against dev. Security-fix PRs would ignore target-branch and
# go to main, so "Dependabot security updates" is turned off in the repo
# settings (alerts stay on): these version updates bump vulnerable deps too.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /            # workspace root: shared, server, frontend + Cargo.lock
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
